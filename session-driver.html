<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Ma session chauffeur • DIGIY</title>
  <meta name="robots" content="noindex,nofollow,noarchive"/>
  <meta name="theme-color" content="#092b20"/>
  <script>
    window.DIGIY_SUPABASE_URL = "https://wesqmwjjtsefyjnluosj.supabase.co";
    window.DIGIY_SUPABASE_ANON_KEY = "sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3";
    window.DIGIY_SUPABASE_ANON = window.DIGIY_SUPABASE_ANON_KEY;
    window.DIGIY_LOGIN_URL = "./pin.html";
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./assets/css/driver-mobile.css?v=mobile-v4"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/driver-secure-api.js?v=mobile-v4"></script>
</head>
<body>
  <header class="topbar">
    <a href="./hub.html">← Portes</a>
    <strong>Session DRIVER</strong>
    <span class="status" id="sessionState">session…</span>
  </header>

  <main class="shell">
    <section class="hero">
      <h1>Ma session</h1>
      <p>Vérifie l’accès ou ferme-le proprement sur cet appareil.</p>
    </section>

    <section class="card">
      <h2>Accès sécurisé</h2>
      <div class="summary">
        <div class="metric"><small>Compte</small><b id="accountText">—</b></div>
        <div class="metric"><small>Expiration</small><b id="expiryText">—</b></div>
      </div>
      <div class="field">
        <label>Jeton</label>
        <div class="input" id="tokenText">Masqué</div>
      </div>
      <div class="bigChoice">
        <a class="btn blue" href="./hub.html">🏠 Retour aux portes</a>
        <button class="btn danger" id="logoutBtn" type="button">🔒 Fermer cette session</button>
      </div>
      <div class="message" id="message">Session locale détectée.</div>
    </section>
  </main>

  <nav class="bottom">
    <a href="./hub.html"><i>🏠</i>Portes</a>
    <a href="./profil-driver.html"><i>👤</i>Profil</a>
    <a href="./tarifs-driver.html"><i>💰</i>Tarifs</a>
    <a class="active" href="./session-driver.html"><i>🔒</i>Session</a>
  </nav>

<script>
(() => {
  "use strict";
  const api = window.DIGIY_DRIVER_SECURE;
  const $ = id => document.getElementById(id);
  const session = api.requireSession();

  if(session){
    $("sessionState").textContent = "session ouverte";
    $("sessionState").className = "status ok";
    const phone = String(session.phone || "");
    $("accountText").textContent = phone ? "•••• " + phone.slice(-4) : "DRIVER";
    $("expiryText").textContent = session.expiresAt
      ? new Date(session.expiresAt).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})
      : "8 h maximum";
    $("tokenText").textContent = "••••••••" + String(session.token || "").slice(-6);
  }

  $("logoutBtn").addEventListener("click",async () => {
    $("logoutBtn").disabled = true;
    $("message").textContent = "⏳ Fermeture de la session…";
    $("message").className = "message warn";
    await api.logout();
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Mes tarifs chauffeur • DIGIY</title>
  <meta name="robots" content="noindex,nofollow,noarchive"/>
  <meta name="theme-color" content="#092b20"/>
  <script>
    window.DIGIY_SUPABASE_URL = "https://wesqmwjjtsefyjnluosj.supabase.co";
    window.DIGIY_SUPABASE_ANON_KEY = "sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3";
    window.DIGIY_SUPABASE_ANON = window.DIGIY_SUPABASE_ANON_KEY;
    window.DIGIY_LOGIN_URL = "./pin.html";
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./assets/css/driver-mobile.css?v=mobile-v4"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/driver-secure-api.js?v=mobile-v4"></script>
</head>
<body>
  <header class="topbar">
    <a href="./hub.html">← Portes</a>
    <strong>Tarifs directs</strong>
    <span class="status" id="sessionState">session…</span>
  </header>

  <main class="shell">
    <section class="hero">
      <h1>Mes tarifs</h1>
      <p>Ajoute, relis et désactive tes prix sans traverser le profil.</p>
    </section>

    <section class="card">
      <h2>Ajouter un trajet</h2>
      <div class="field"><label for="routeLabel">Trajet</label><input class="input" id="routeLabel" placeholder="Saly → Dakar"/></div>
      <div class="field"><label for="priceFcfa">Prix FCFA</label><input class="input" id="priceFcfa" inputmode="numeric" placeholder="32000"/></div>
      <button class="btn primary" id="saveRateBtn" type="button" style="width:100%;margin-top:14px">🚕 Enregistrer ce tarif</button>
      <div class="message" id="message">Chargement…</div>
    </section>

    <section class="card">
      <h2>Tarifs actifs</h2>
      <div class="summary">
        <div class="metric"><small>Nombre</small><b id="rateCount">0</b></div>
        <div class="metric"><small>Prix minimum</small><b id="rateMin">—</b></div>
      </div>
      <div class="rateList" id="rateList"><div class="empty">Chargement…</div></div>
    </section>
  </main>

  <nav class="bottom">
    <a href="./hub.html"><i>🏠</i>Portes</a>
    <a href="./profil-driver.html"><i>👤</i>Profil</a>
    <a class="active" href="./tarifs-driver.html"><i>💰</i>Tarifs</a>
    <a href="./session-driver.html"><i>🔒</i>Session</a>
  </nav>

<script>
(() => {
  "use strict";
  const api = window.DIGIY_DRIVER_SECURE;
  const $ = id => document.getElementById(id);
  let rows = [];

  function showMessage(text,type){
    $("message").textContent = text;
    $("message").className = "message " + (type || "");
  }

  function render(){
    $("rateCount").textContent = String(rows.length);
    const prices = rows.map(r => Number(r.price_fcfa || 0)).filter(n => n > 0);
    $("rateMin").textContent = prices.length ? api.formatFcfa(Math.min(...prices)) : "—";
    const list = $("rateList");
    list.innerHTML = "";
    if(!rows.length){
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Aucun tarif actif.";
      list.appendChild(empty);
      return;
    }
    rows.forEach(r => {
      const item = document.createElement("div");
      item.className = "rate";
      const info = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = r.route_label || "Trajet";
      const price = document.createElement("span");
      price.textContent = api.formatFcfa(r.price_fcfa);
      info.append(title,price);
      const disable = document.createElement("button");
      disable.className = "btn danger";
      disable.type = "button";
      disable.textContent = "Désactiver";
      disable.addEventListener("click",() => disableRate(r.id,disable));
      item.append(info,disable);
      list.appendChild(item);
    });
  }

  async function load(){
    if(!api.requireSession()) return;
    $("sessionState").textContent = "session ouverte";
    $("sessionState").className = "status ok";
    try{
      const data = await api.listRates();
      rows = api.ratesFrom(data).filter(r => r?.is_active !== false);
      render();
      showMessage("✅ Tarifs synchronisés avec Supabase.","ok");
    }catch(error){
      api.handleError(error,$("message"));
    }
  }

  async function saveRate(){
    const label = $("routeLabel").value.trim().replace(/\s+/g," ");
    const price = Number(String($("priceFcfa").value || "").replace(/\D/g,""));
    if(label.length < 2) return showMessage("❌ Indique le trajet.","bad");
    if(!Number.isFinite(price) || price <= 0) return showMessage("❌ Prix invalide.","bad");
    const btn = $("saveRateBtn");
    btn.disabled = true;
    showMessage("⏳ Enregistrement…","warn");
    try{
      await api.upsertRate(label,price);
      $("routeLabel").value = "";
      $("priceFcfa").value = "";
      await load();
      showMessage("✅ Tarif enregistré.","ok");
    }catch(error){
      api.handleError(error,$("message"));
    }finally{
      btn.disabled = false;
    }
  }

  async function disableRate(id,btn){
    btn.disabled = true;
    showMessage("⏳ Désactivation…","warn");
    try{
      await api.disableRate(id);
      await load();
      showMessage("✅ Tarif désactivé.","ok");
    }catch(error){
      api.handleError(error,$("message"));
      btn.disabled = false;
    }
  }

  $("saveRateBtn").addEventListener("click",saveRate);
  load();
})();
</script>
</body>
</html>

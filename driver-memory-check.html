<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DIGIY DRIVER — Contrôle mémoire trajets</title>
<meta name="robots" content="noindex,nofollow"/>
<style>
body{margin:0;padding:18px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0e4226;color:#f0fff5;font-weight:900}
.wrap{max-width:820px;margin:auto;display:grid;gap:14px}
.card{border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:18px;background:rgba(255,255,255,.08)}
h1{font-size:38px;line-height:.95;margin:0 0 8px;font-weight:1000}
h2{font-size:28px;margin:0 0 10px;font-weight:1000}
pre{white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.22);padding:14px;border-radius:16px;font-size:14px}
button{min-height:58px;border-radius:18px;border:0;padding:12px 16px;font-size:18px;font-weight:1000;background:#facc15;color:#241300}
</style>
<script src="./assets/js/digiy-driver-memory-fix.js"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Contrôle mémoire DRIVER</h1>
    <p>Cette page montre les deux mémoires : courses programmées et trajets proposés.</p>
    <button onclick="render()">↻ Relire</button>
  </div>
  <div class="card"><h2>Courses programmées · pense-bête</h2><pre id="scheduled">Lecture…</pre></div>
  <div class="card"><h2>Trajets proposés · fiche client</h2><pre id="proposed">Lecture…</pre></div>
</div>
<script>
function render(){
  var m = window.DIGIY_DRIVER_MEMORY;
  document.getElementById("scheduled").textContent = JSON.stringify(m ? m.readScheduledTrips() : [], null, 2);
  document.getElementById("proposed").textContent = JSON.stringify(m ? m.readProposedRoutes() : [], null, 2);
}
render();
</script>
</body>
</html>

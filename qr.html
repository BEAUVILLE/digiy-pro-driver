<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#061b14"/>
  <title>DIGIY BUILD — QR fiche artisan</title>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --bg:#061b14;
      --accent:#facc15;
      --green:#22c55e;
      --muted:rgba(234,255,241,.72);
      --text:#eafff1;
      --line:rgba(255,255,255,.14);
      --shadow:0 18px 60px rgba(0,0,0,.45);
      --r:20px;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:Outfit,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      min-height:100vh;
      background:
        radial-gradient(900px 520px at 10% -10%, rgba(34,197,94,.18), transparent 60%),
        radial-gradient(900px 520px at 110% 0%, rgba(250,204,21,.12), transparent 55%),
        linear-gradient(135deg,#04110d,#061b14);
    }

    a{color:inherit;text-decoration:none}

    .back{
      position:fixed;
      left:14px;
      top:14px;
      z-index:999;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:12px 14px;
      border-radius:14px;
      text-decoration:none;
      font-weight:950;
      font-size:14px;
      color:#eafff1;
      background:rgba(7,24,16,.88);
      border:1px solid rgba(250,204,21,.22);
      box-shadow:0 14px 40px rgba(0,0,0,.32);
      backdrop-filter:blur(8px);
    }

    .wrap{
      max-width:900px;
      margin:auto;
      padding:18px;
      padding-top:76px;
    }

    .hero{margin-bottom:14px}

    .kicker{
      color:var(--accent);
      font-weight:1000;
      letter-spacing:.16em;
      text-transform:uppercase;
      font-size:12px;
      margin-bottom:8px;
    }

    h1{
      font-size:clamp(1.8rem,5vw,3.1rem);
      line-height:1.05;
      margin-bottom:8px;
      font-weight:1000;
      letter-spacing:-.04em;
      background:linear-gradient(135deg, var(--green), var(--accent));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    p{
      color:var(--muted);
      line-height:1.5;
      margin-bottom:10px;
      font-weight:750;
      font-size:1.02rem;
    }

    .card{
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--line);
      border-radius:var(--r);
      padding:16px;
      margin-top:14px;
      box-shadow:var(--shadow);
    }

    .pillRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }

    .pill{
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.18);
      color:#d1fae5;
      font-weight:900;
      font-size:.92rem;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:10px;
    }

    .btn{
      flex:1 1 210px;
      min-height:50px;
      padding:12px 14px;
      border-radius:14px;
      font-weight:950;
      border:none;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      transition:transform .12s ease, filter .12s ease, opacity .12s ease;
      font-family:inherit;
      font-size:1rem;
    }

    .btn:hover:not(:disabled){
      transform:translateY(-1px);
      filter:brightness(1.05);
    }

    .btn:disabled{opacity:.55;cursor:not-allowed}

    .btn.primary{
      background:linear-gradient(135deg, rgba(250,204,21,.96), rgba(245,158,11,.88));
      color:#241300;
      box-shadow:0 8px 22px rgba(250,204,21,.22);
    }

    .btn.good{
      background:linear-gradient(135deg, rgba(34,197,94,.95), rgba(16,185,129,.85));
      color:#042012;
      box-shadow:0 8px 22px rgba(34,197,94,.24);
    }

    .btn.ghost{
      background:rgba(255,255,255,.08);
      border:1px solid var(--line);
      color:var(--text);
    }

    .qrbox{
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
      border-radius:18px;
      border:1px dashed rgba(250,204,21,0.35);
      background:rgba(0,0,0,0.14);
      margin-top:14px;
      min-height:260px;
    }

    .qrImg{
      max-width:100%;
      width:330px;
      height:auto;
      border-radius:16px;
      background:#fff;
      padding:12px;
      display:block;
      border:1px solid rgba(148,163,184,.22);
    }

    .label{
      margin-top:12px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(0,0,0,0.14);
      line-height:1.4;
      word-break:break-all;
      color:#d1fae5;
      font-size:.93rem;
      font-weight:850;
    }

    .note{
      margin-top:12px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--line);
      display:none;
      white-space:pre-wrap;
      line-height:1.45;
      font-weight:850;
    }

    .note.ok{display:block;border-color:rgba(34,197,94,.35);color:#bbf7d0;background:rgba(34,197,94,.08)}
    .note.bad{display:block;border-color:rgba(251,113,133,.35);color:#fecaca;background:rgba(251,113,133,.08)}
    .note.warn{display:block;border-color:rgba(250,204,21,.35);color:#fde68a;background:rgba(250,204,21,.08)}

    .mini{
      margin-top:12px;
      color:var(--muted);
      font-size:.9rem;
      font-weight:800;
      line-height:1.4;
    }

    @media(max-width:680px){
      .wrap{padding:14px;padding-top:76px;padding-bottom:84px}
      .qrImg{width:270px}
      .btn{flex:1 1 100%}
      .back{left:12px;right:12px;top:auto;bottom:calc(12px + env(safe-area-inset-bottom, 0px))}
    }
  </style>
</head>

<body>
  <a id="btnBack" href="./listing.html" class="back">← Retour galerie</a>

  <div class="wrap">
    <div class="hero">
      <div class="kicker">DIGIY BUILD · QR fiche</div>
      <h1 id="titleBox">QR fiche artisan</h1>
      <p id="subBox">Un QR propre pour faire circuler la fiche : WhatsApp, affiche, sticker, vitrine, carte ou chantier.</p>
    </div>

    <div class="card">
      <div class="pillRow">
        <div class="pill" id="pillMetier">métier : —</div>
        <div class="pill" id="pillVille">zone : —</div>
        <div class="pill">fiche publique</div>
      </div>

      <div class="row">
        <button class="btn primary" id="btnCopy" type="button">📋 Copier le lien</button>
        <button class="btn ghost" id="btnShare" type="button">📤 Partager</button>
        <button class="btn good" id="btnOpen" type="button">↗️ Ouvrir la fiche</button>
      </div>

      <div class="row">
        <button class="btn primary" id="btnDownload" type="button">⬇️ Télécharger le QR (PNG)</button>
        <button class="btn ghost" id="btnSticker" type="button">🟩 Télécharger le sticker XL</button>
      </div>

      <div class="qrbox">
        <a id="qrAnchor" href="#" target="_blank" rel="noopener">
          <img id="qrImg" class="qrImg" alt="QR DIGIY BUILD fiche artisan"/>
        </a>
      </div>

      <div class="label" id="urlBox">Lien : —</div>
      <div class="note warn" id="note"></div>
      <div class="mini" id="dbg">QR public · fiche artisan · DIGIY BUILD</div>
    </div>
  </div>

  <script>
    (async function(){
      "use strict";

      const LOCAL_PROFILES = {
        "partenaires-mbaye": {
          title: "Mbaye Diouf",
          metier: "Bâtisseur · villas modernes · piscines · finitions haut de gamme",
          ville: "Saly / Mbour / Thiès"
        },
        "partenaires-zal-kourant": {
          title: "Zal & Kourant",
          metier: "Électriciens · installation · rénovation · dépannage",
          ville: "Saly"
        },
        "partenaires-helage-plombier": {
          title: "Helage",
          metier: "Plombier multi-services · dépannage · installation · salle de bain",
          ville: "Saly"
        }
      };

      function normSlug(v){
        return String(v || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g,"")
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9]+/g,"-")
          .replace(/-+/g,"-")
          .replace(/^-|-$/g,"");
      }

      const qs = new URLSearchParams(location.search);
      let targetUrl = qs.get("url") || "";
      const slug = normSlug(qs.get("slug") || "");
      const local = LOCAL_PROFILES[slug] || {};
      const title = qs.get("title") || local.title || "Fiche artisan DIGIYLYFE";
      const metier = qs.get("metier") || local.metier || "Service utile";
      const ville = qs.get("ville") || local.ville || "Zone à préciser";

      if(!targetUrl && slug){
        const u = new URL("./fiche.html", location.href);
        u.searchParams.set("slug", slug);
        targetUrl = u.toString();
      }

      if(!targetUrl){
        targetUrl = new URL("./listing.html", location.href).toString();
      }

      try{
        targetUrl = new URL(targetUrl, location.href).toString();
      }catch(_){
        targetUrl = new URL("./listing.html", location.href).toString();
      }

      const qrImg = document.getElementById("qrImg");
      const qrAnchor = document.getElementById("qrAnchor");
      const urlBox = document.getElementById("urlBox");
      const noteEl = document.getElementById("note");
      const titleBox = document.getElementById("titleBox");
      const subBox = document.getElementById("subBox");
      const pillMetier = document.getElementById("pillMetier");
      const pillVille = document.getElementById("pillVille");

      const btnCopy = document.getElementById("btnCopy");
      const btnShare = document.getElementById("btnShare");
      const btnOpen = document.getElementById("btnOpen");
      const btnDownload = document.getElementById("btnDownload");
      const btnSticker = document.getElementById("btnSticker");
      const btnBack = document.getElementById("btnBack");

      let qrNormalDataUrl = "";
      let qrXLDataUrl = "";

      titleBox.textContent = title;
      subBox.textContent = `${metier}${ville ? " · " + ville : ""}. QR prêt à partager ou imprimer.`;
      pillMetier.textContent = "métier : " + metier;
      pillVille.textContent = "zone : " + ville;
      qrAnchor.href = targetUrl;
      urlBox.textContent = "Lien : " + targetUrl;
      btnBack.href = "./listing.html";

      function note(msg, type){
        noteEl.className = "note " + (type || "warn");
        noteEl.textContent = msg || "";
        noteEl.style.display = msg ? "block" : "none";
      }

      function setBusy(on){
        [btnCopy,btnShare,btnOpen,btnDownload,btnSticker].forEach(b => b.disabled = !!on);
      }

      async function copyText(value){
        if(navigator.clipboard?.writeText){
          return navigator.clipboard.writeText(value);
        }
        const ta = document.createElement("textarea");
        ta.value = value;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        ta.remove();
        if(!ok) throw new Error("copy_failed");
      }

      function directDownload(dataUrl, filename){
        const a = document.createElement("a");
        a.href = dataUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }

      function makeQrDataUrl(value, size){
        return new Promise((resolve, reject) => {
          if(!window.QRCode?.toDataURL){
            reject(new Error("QRCode lib missing"));
            return;
          }
          window.QRCode.toDataURL(value, {
            width:size,
            margin:1,
            errorCorrectionLevel:"M",
            color:{dark:"#111827", light:"#FFFFFF"}
          }, (err, dataUrl) => err ? reject(err) : resolve(dataUrl));
        });
      }

      function fallbackQrApi(size){
        const u = new URL("https://api.qrserver.com/v1/create-qr-code/");
        u.searchParams.set("size", `${size}x${size}`);
        u.searchParams.set("margin", "16");
        u.searchParams.set("data", targetUrl);
        return u.toString();
      }

      setBusy(true);
      note("⏳ Préparation du QR…", "warn");

      try{
        qrNormalDataUrl = await makeQrDataUrl(targetUrl, 560);
        qrXLDataUrl = await makeQrDataUrl(targetUrl, 980);
        qrImg.src = qrNormalDataUrl;
        note("✅ QR prêt. Teste-le au téléphone avant impression.", "ok");
      }catch(e){
        console.warn(e);
        qrNormalDataUrl = fallbackQrApi(560);
        qrXLDataUrl = fallbackQrApi(980);
        qrImg.src = qrNormalDataUrl;
        note("✅ QR prêt avec générateur externe.", "ok");
      }finally{
        setBusy(false);
      }

      btnCopy.onclick = async () => {
        try{
          await copyText(targetUrl);
          note("✅ Lien copié.", "ok");
        }catch(_){
          window.prompt("Copie le lien :", targetUrl);
        }
      };

      btnShare.onclick = async () => {
        try{
          if(navigator.share){
            await navigator.share({title, text:`${metier} · ${ville}`, url:targetUrl});
            return;
          }
        }catch(_){}
        btnCopy.click();
      };

      btnOpen.onclick = () => window.open(targetUrl, "_blank", "noopener");

      btnDownload.onclick = () => {
        if(!qrNormalDataUrl) return note("❌ QR non prêt.", "bad");
        directDownload(qrNormalDataUrl, "DIGIY_QR_BUILD_FICHE.png");
        note("⬇️ Téléchargement lancé.", "ok");
      };

      btnSticker.onclick = () => {
        if(!qrXLDataUrl) return note("❌ Sticker non prêt.", "bad");
        directDownload(qrXLDataUrl, "DIGIY_STICKER_XL_BUILD_FICHE.png");
        note("⬇️ Sticker XL téléchargé.", "ok");
      };
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Visibilité chauffeur • DIGIY</title>
  <meta name="robots" content="noindex,nofollow,noarchive"/>
  <meta name="theme-color" content="#092b20"/>
  <script>
    window.DIGIY_SUPABASE_URL = "https://wesqmwjjtsefyjnluosj.supabase.co";
    window.DIGIY_SUPABASE_ANON_KEY = "sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3";
    window.DIGIY_SUPABASE_ANON = window.DIGIY_SUPABASE_ANON_KEY;
    window.DIGIY_LOGIN_URL = "./pin.html";
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./assets/css/driver-mobile.css?v=mobile-v4"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/driver-secure-api.js?v=mobile-v4"></script>
</head>
<body>
  <header class="topbar">
    <a href="./hub.html">← Portes</a>
    <strong>Visibilité</strong>
    <span class="status" id="sessionState">session…</span>
  </header>

  <main class="shell">
    <section class="hero">
      <h1>Ma visibilité</h1>
      <p>Un écran, une décision : apparaître ou rester masqué.</p>
    </section>

    <section class="card">
      <h2>État actuel</h2>
      <div class="metric">
        <small>Profil chauffeur</small>
        <b id="visibilityText">Chargement…</b>
      </div>
      <div class="bigChoice">
        <button class="btn primary" id="publishBtn" type="button">✅ Publier mon profil</button>
        <button class="btn danger" id="hideBtn" type="button">🙈 Masquer mon profil</button>
      </div>
      <div class="message" id="message">Chargement…</div>
    </section>
  </main>

  <nav class="bottom">
    <a href="./hub.html"><i>🏠</i>Portes</a>
    <a href="./profil-driver.html"><i>👤</i>Profil</a>
    <a href="./tarifs-driver.html"><i>💰</i>Tarifs</a>
    <a class="active" href="./visibilite-driver.html"><i>👁️</i>Visible</a>
  </nav>

<script>
(() => {
  "use strict";
  const api = window.DIGIY_DRIVER_SECURE;
  const $ = id => document.getElementById(id);
  let cockpit = null;

  function showMessage(text,type){
    $("message").textContent = text;
    $("message").className = "message " + (type || "");
  }

  function render(){
    const visible = !!cockpit?.profile?.is_published;
    $("visibilityText").textContent = visible ? "Publié — visible côté client" : "Masqué — non visible côté client";
    $("publishBtn").disabled = visible;
    $("hideBtn").disabled = !visible;
  }

  async function load(){
    if(!api.requireSession()) return;
    $("sessionState").textContent = "session ouverte";
    $("sessionState").className = "status ok";
    try{
      cockpit = await api.getCockpit();
      render();
      showMessage("✅ État synchronisé.","ok");
    }catch(error){
      api.handleError(error,$("message"));
    }
  }

  async function setVisibility(value){
    if(!cockpit?.profile) return;
    $("publishBtn").disabled = true;
    $("hideBtn").disabled = true;
    showMessage("⏳ Mise à jour…","warn");
    try{
      await api.saveProfile(api.profilePayload(cockpit.profile,{p_is_published:value}));
      await load();
      showMessage(value ? "✅ Profil publié." : "✅ Profil masqué.","ok");
    }catch(error){
      api.handleError(error,$("message"));
      render();
    }
  }

  $("publishBtn").addEventListener("click",() => setVisibility(true));
  $("hideBtn").addEventListener("click",() => setVisibility(false));
  load();
})();
</script>
</body>
</html>

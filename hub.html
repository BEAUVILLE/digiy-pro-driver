<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>DIGIY DRIVER — Accueil chauffeur</title>
  <meta name="description" content="Accueil chauffeur DIGIY DRIVER : fiche, carte QR et partage WhatsApp."/>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet"/>
  <meta name="theme-color" content="#071b14"/>
  <meta name="digiy-build" content="driver-simple-hub-v6-20260715"/>

  <script>
    window.DIGIY_MODULE = "DRIVER";
    window.DIGIY_LOGIN_URL = "./pin.html";
    window.DIGIY_SUPABASE_URL = "https://wesqmwjjtsefyjnluosj.supabase.co";
    window.DIGIY_SUPABASE_ANON_KEY = "sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3";
    window.DIGIY_SUPABASE_ANON = window.DIGIY_SUPABASE_ANON_KEY;
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./guard.js?v=driver-guard-20260531"></script>

  <style>
    :root{
      color-scheme:dark;
      --bg:#071b14;
      --bg2:#0b2a1f;
      --card:rgba(255,255,255,.065);
      --line:rgba(255,255,255,.14);
      --text:#effff5;
      --muted:rgba(239,255,245,.68);
      --green:#22c55e;
      --gold:#facc15;
      --shadow:0 22px 70px rgba(0,0,0,.42);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
    }

    body{
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:22px;
      color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      background:
        radial-gradient(900px 520px at 8% -10%,rgba(34,197,94,.18),transparent 60%),
        radial-gradient(760px 480px at 106% 8%,rgba(250,204,21,.11),transparent 56%),
        linear-gradient(180deg,var(--bg2),var(--bg));
    }

    main{
      width:min(480px,100%);
      padding:24px;
      border:1px solid var(--line);
      border-radius:28px;
      background:var(--card);
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    h1{
      margin:0 0 22px;
      font-size:clamp(2rem,9vw,3rem);
      line-height:1.02;
      letter-spacing:-.045em;
    }

    nav{
      display:grid;
      gap:12px;
    }

    a,button{
      width:100%;
      min-height:62px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:14px 18px;
      border:1px solid var(--line);
      border-radius:18px;
      color:var(--text);
      background:rgba(255,255,255,.075);
      font:inherit;
      font-size:1rem;
      font-weight:900;
      text-align:center;
      text-decoration:none;
      cursor:pointer;
      transition:transform .14s ease,background .14s ease,border-color .14s ease;
    }

    a:first-child{
      color:#052012;
      border-color:transparent;
      background:linear-gradient(135deg,var(--green),#16a34a);
    }

    a:nth-child(2){
      color:#fff7c7;
      border-color:rgba(250,204,21,.32);
      background:rgba(250,204,21,.11);
    }

    a:hover,button:hover{
      transform:translateY(-1px);
      border-color:rgba(255,255,255,.26);
      background:rgba(255,255,255,.12);
    }

    a:first-child:hover{
      border-color:transparent;
      background:linear-gradient(135deg,#2bd368,#18ad4d);
    }

    a:active,button:active{transform:none}

    button:disabled{
      opacity:.62;
      cursor:progress;
      transform:none;
    }

    #status{
      margin:14px 0 0;
      padding:11px 12px;
      border:1px solid rgba(250,204,21,.28);
      border-radius:14px;
      color:#fff2a8;
      background:rgba(250,204,21,.09);
      font-size:.88rem;
      font-weight:800;
      line-height:1.4;
    }

    #status[hidden]{display:none}

    #status.bad{
      color:#fecaca;
      border-color:rgba(251,113,133,.32);
      background:rgba(251,113,133,.10);
    }

    @media(max-width:420px){
      body{padding:14px}
      main{padding:19px;border-radius:23px}
      h1{margin-bottom:18px}
      a,button{min-height:58px}
    }
  </style>
</head>
<body>
  <main>
    <h1>Bonjour chauffeur.</h1>

    <nav aria-label="Actions chauffeur">
      <a href="./ma-fiche.html">Ma fiche chauffeur</a>
      <a href="./generateur-digiy-driver.html">Ma carte QR</a>
      <button id="shareWhatsApp" type="button">Partager sur WhatsApp</button>
    </nav>

    <p id="status" role="status" aria-live="polite" hidden></p>
  </main>

  <script>
    (() => {
      "use strict";

      const PUBLIC_FICHE_BASE = "https://beauville.github.io/galerie-chauffeurs/fiche-chauffeur.html";
      const shareButton = document.getElementById("shareWhatsApp");
      const statusBox = document.getElementById("status");

      function setStatus(message, type){
        statusBox.textContent = message;
        statusBox.className = type || "";
        statusBox.hidden = !message;
      }

      function normPhone(value){
        const digits = String(value || "").replace(/[^\d]/g, "");
        if(!digits) return "";
        if(digits.startsWith("221") && digits.length === 12) return digits;
        if(digits.length === 9) return "221" + digits;
        return digits;
      }

      function allValues(row){
        if(!row || typeof row !== "object") return [];
        return Object.values(row)
          .map(value => String(value == null ? "" : value).trim())
          .filter(Boolean);
      }

      function rowPhones(row){
        return [
          row && row.phone,
          row && row.whatsapp,
          row && row.wa,
          row && row.driver_phone,
          row && row.contact_phone
        ]
          .concat(allValues(row))
          .map(normPhone)
          .filter(Boolean);
      }

      function pickCardSlug(row){
        const candidates = [
          row && row.slug,
          row && row.card_slug,
          row && row.public_slug,
          row && row.public_card_slug
        ].concat(allValues(row));

        for(const raw of candidates){
          const value = String(raw || "").trim();

          if(/^card-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(value)){
            return value;
          }

          if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(value)){
            return "card-" + value;
          }
        }

        return "";
      }

      async function getGuardSession(){
        const guard = window.DIGIY_GUARD;
        if(!guard) throw new Error("Protection chauffeur indisponible.");

        if(typeof guard.ready === "function"){
          await guard.ready({ redirect:true, preserve_validation:true });
        }

        if(typeof guard.isAuthenticated === "function" && !guard.isAuthenticated()){
          throw new Error("Session chauffeur expirée.");
        }

        return typeof guard.getSession === "function"
          ? (guard.getSession() || {})
          : (guard.state || {});
      }

      function makeClient(){
        if(window.sb) return window.sb;

        if(!window.supabase || typeof window.supabase.createClient !== "function"){
          return null;
        }

        return window.supabase.createClient(
          window.DIGIY_SUPABASE_URL,
          window.DIGIY_SUPABASE_ANON_KEY,
          {
            auth:{
              persistSession:false,
              autoRefreshToken:false,
              detectSessionInUrl:false,
              storageKey:"digiy-driver-simple-hub"
            }
          }
        );
      }

      async function resolvePublicFiche(){
        const session = await getGuardSession();
        const guard = window.DIGIY_GUARD;
        const phone = normPhone(
          (guard && typeof guard.getPhone === "function" && guard.getPhone()) ||
          session.phone ||
          session.driver_phone ||
          ""
        );

        if(!phone){
          throw new Error("Téléphone chauffeur introuvable dans la session.");
        }

        const client = makeClient();
        if(!client){
          throw new Error("Connexion indisponible.");
        }

        const { data, error } = await client.rpc("digiy_driver_public_gallery");
        if(error) throw error;

        const rows = Array.isArray(data) ? data : [];
        const found = rows.find(row => rowPhones(row).includes(phone));
        const cardSlug = pickCardSlug(found);

        if(!cardSlug){
          throw new Error("Ta fiche publique n’est pas encore disponible.");
        }

        const url = new URL(PUBLIC_FICHE_BASE);
        url.searchParams.set("slug", cardSlug);
        return url.toString();
      }

      shareButton.addEventListener("click", async () => {
        shareButton.disabled = true;
        setStatus("Préparation de ta fiche…");

        try{
          const publicUrl = await resolvePublicFiche();
          const message = "Bonjour, voici ma fiche chauffeur DIGIY : " + publicUrl;
          const whatsappUrl = "https://wa.me/?text=" + encodeURIComponent(message);
          setStatus("");
          window.location.href = whatsappUrl;
        }catch(error){
          console.error("[driver-simple-hub]", error);
          setStatus(
            error && error.message
              ? error.message
              : "Impossible de préparer le partage pour le moment.",
            "bad"
          );
          shareButton.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>

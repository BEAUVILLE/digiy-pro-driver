<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>DIGIY DRIVER — Entrée vers les portes</title>
  <meta name="theme-color" content="#13824d"/>
  <meta name="description" content="DIGIY DRIVER — entrée légère vers le HUB chauffeur."/>
  <meta name="robots" content="noindex,nofollow"/>
  <meta name="digiy-build" content="driver-v4-6-index-direct-hub"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"/>

  <script>
    window.DIGIY_MODULE = "DRIVER";
    window.DIGIY_LOGIN_URL = "./pin.html";
  </script>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:18px;
      font-family:Outfit,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:#f8fff9;
      background:
        radial-gradient(900px 520px at 8% -10%, rgba(250,204,21,.20), transparent 62%),
        radial-gradient(760px 440px at 105% 0%, rgba(34,197,94,.24), transparent 58%),
        linear-gradient(180deg,#13824d,#0f6b3e 55%,#0b4f31 100%);
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }

    .card{
      width:min(620px,100%);
      border:1px solid rgba(255,255,255,.24);
      border-radius:30px;
      padding:24px;
      background:
        radial-gradient(620px 230px at 100% 0%, rgba(250,204,21,.15), transparent 70%),
        linear-gradient(180deg,rgba(23,134,79,.96),rgba(17,107,64,.96));
      box-shadow:0 22px 52px rgba(0,0,0,.24);
      text-align:center;
    }

    .logo{
      width:118px;
      height:auto;
      display:block;
      margin:0 auto 16px;
      object-fit:contain;
      filter:drop-shadow(0 10px 20px rgba(0,0,0,.18));
    }

    .kicker{
      color:#fff0a8;
      font-size:14px;
      font-weight:1000;
      letter-spacing:.13em;
      text-transform:uppercase;
      margin-bottom:11px;
    }

    h1{
      margin:0 0 12px;
      font-size:clamp(40px,10vw,64px);
      line-height:.94;
      letter-spacing:-.065em;
      font-weight:1000;
    }

    p{
      margin:0 0 18px;
      color:rgba(248,255,249,.88);
      font-size:20px;
      line-height:1.42;
      font-weight:950;
    }

    .actions{
      display:grid;
      gap:10px;
      margin-top:18px;
    }

    a,button{
      min-height:64px;
      border-radius:22px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:15px 18px;
      text-decoration:none;
      font-size:19px;
      font-weight:1000;
      border:1px solid rgba(255,255,255,.18);
      cursor:pointer;
      font-family:inherit;
    }

    .primary{
      color:#241300;
      background:linear-gradient(135deg,#facc15,#f59e0b);
      box-shadow:0 14px 30px rgba(0,0,0,.18);
      border-color:transparent;
    }

    .ghost{
      color:#f8fff9;
      background:rgba(255,255,255,.08);
    }

    .hint{
      margin-top:13px;
      color:rgba(248,255,249,.70);
      font-size:15px;
      line-height:1.4;
      font-weight:900;
    }

    @media(max-width:520px){
      .card{padding:20px}
      h1{font-size:42px}
      p{font-size:19px}
      a,button{font-size:18px}
    }
  </style>
</head>

<body>
  <main class="card">
    <img class="logo" src="https://digiylyfe.net/wp-content/uploads/2026/05/metier-pro-1.png" alt="DIGIY — L’écosystème direct des métiers pro"/>
    <div class="kicker">DIGIY DRIVER</div>
    <h1>Direction les portes.</h1>
    <p>
      L’entrée reste légère. Le vrai centre chauffeur est maintenant le HUB.
    </p>

    <div class="actions">
      <a class="primary" id="goHub" href="./hub.html">☰ Ouvrir les portes DRIVER</a>
      <a class="ghost" id="goPin" href="./pin.html">🔐 Ouvrir mon accès</a>
    </div>

    <div class="hint">
      Aucun téléphone visible. Aucun dashboard en plus. Le chauffeur choisit sa porte et agit.
    </div>
  </main>

  <script>
    (function(){
      const AUTO_REDIRECT = true;
      const REDIRECT_DELAY_MS = 650;

      function cleanTarget(path){
        try{
          const current = new URL(location.href);
          const target = new URL(path, location.href);

          current.searchParams.forEach(function(value,key){
            const sensitive = [
              "phone","tel","wa","p_phone","owner_phone",
              "checkout_phone","subscription_phone","identifiant"
            ];
            if(sensitive.includes(key)) return;

            if(key === "slug"){
              const slug = String(value || "").trim().toLowerCase();
              const looksLikePhoneSlug = /^driver-\d{9,15}$/.test(slug) || /\d{7,}/.test(slug);
              if(looksLikePhoneSlug) return;
            }

            target.searchParams.set(key,value);
          });

          return target.pathname + target.search + target.hash;
        }catch(_){
          return path;
        }
      }

      const hub = cleanTarget("./hub.html");
      const pin = cleanTarget("./pin.html");

      const hubLink = document.getElementById("goHub");
      const pinLink = document.getElementById("goPin");

      if(hubLink) hubLink.href = hub;
      if(pinLink) pinLink.href = pin;

      try{
        const current = new URL(location.href);
        let changed = false;
        ["phone","tel","wa","p_phone","owner_phone","checkout_phone","subscription_phone","identifiant"].forEach(function(k){
          if(current.searchParams.has(k)){
            current.searchParams.delete(k);
            changed = true;
          }
        });
        const slug = String(current.searchParams.get("slug") || "").trim().toLowerCase();
        if(slug && (/^driver-\d{9,15}$/.test(slug) || /\d{7,}/.test(slug))){
          current.searchParams.delete("slug");
          changed = true;
        }
        if(changed){
          history.replaceState({}, document.title, current.pathname + current.search + current.hash);
        }
      }catch(_){}

      if(AUTO_REDIRECT){
        setTimeout(function(){
          location.replace(hub);
        }, REDIRECT_DELAY_MS);
      }
    })();
  </script>
</body>
</html>

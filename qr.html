<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Je conduis — QR chauffeur</title>
<meta name="theme-color" content="#061b14">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="description" content="DIGIY DRIVER PRO — QR chauffeur public, avec retour fiche QR intégrée.">
<meta name="digiy-build" content="driver-qr-carre-fiche-qr-20260618">
<script>
window.DIGIY_MODULE="DRIVER";
window.DIGIY_LOGIN_URL="./pin.html";
window.DIGIY_PUBLIC_BASE_URL=window.DIGIY_PUBLIC_BASE_URL||"https://driver-client.digiylyfe.com/";
</script>
<style>
:root{--bg:#061b14;--text:#eafff1;--muted:rgba(234,255,241,.78);--gold:#facc15;--green:#22c55e;--line:rgba(255,255,255,.14);--shadow:0 18px 42px rgba(0,0,0,.36);--font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:var(--font);color:var(--text);font-weight:900;background:radial-gradient(900px 520px at 12% -8%,rgba(250,204,21,.14),transparent 58%),radial-gradient(900px 520px at 92% 0%,rgba(34,197,94,.16),transparent 58%),linear-gradient(180deg,#03120d,var(--bg));padding:16px}a{color:inherit;text-decoration:none}button,input{font:inherit}.card{width:min(560px,100%);margin:0 auto;border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.06);box-shadow:var(--shadow);padding:20px;text-align:center}.kicker{display:inline-flex;min-height:32px;align-items:center;padding:0 11px;border-radius:999px;border:1px solid rgba(250,204,21,.25);background:rgba(250,204,21,.10);color:#fde68a;font-size:12px;letter-spacing:.1em;text-transform:uppercase}h1{margin:12px 0 8px;font-size:clamp(34px,8vw,52px);line-height:.92;letter-spacing:-.055em}p{color:var(--muted);line-height:1.5;margin:0 0 14px}.qrWrap{background:#fff;color:#061b14;border-radius:24px;padding:18px;margin:16px auto}.qrWrap img{width:100%;max-width:340px;border-radius:16px}.label{font-size:20px;font-weight:1000;margin-top:10px}.url{word-break:break-all;color:rgba(234,255,241,.68);font-size:13px;line-height:1.4;margin:12px 0}.btns{display:grid;gap:10px}.btn{min-height:54px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:1000}.btn.gold{background:linear-gradient(135deg,var(--gold),#fff0a8);color:#231a07;border:0}.btn.green{background:linear-gradient(135deg,var(--green),#bbf7d0);color:#052215;border:0}@media print{body{background:#fff;color:#000}.card{box-shadow:none;border:0}.kicker,p,.btns,.url{display:none}.qrWrap{padding:0}.qrWrap img{max-width:440px}}
</style>
</head>
<body>
<main class="card">
  <span class="kicker">DIGIY DRIVER · QR terrain</span>
  <h1>QR chauffeur</h1>
  <p>QR seul pour impression rapide. La fiche complète avec QR intégré reste disponible dans “Fiche QR”.</p>
  <div class="qrWrap">
    <img id="qrImg" alt="QR chauffeur DIGIY DRIVER" src="">
    <div class="label" id="qrLabel">Mon chauffeur</div>
    <small>BY DIGIYLYFE</small>
  </div>
  <div class="url" id="targetUrl">Préparation du lien…</div>
  <div class="btns">
    <a class="btn green" id="openPublic" href="https://driver-client.digiylyfe.com/" target="_blank" rel="noopener noreferrer">🚗 Ouvrir lien public</a>
    <a class="btn gold" href="./fiche.html">🪪 Fiche QR intégrée</a>
    <button class="btn gold" id="printBtn" type="button">🖨️ Imprimer QR</button>
    <button class="btn" id="copyBtn" type="button">📋 Copier lien</button>
    <a class="btn" href="./index.html">← Retour DRIVER</a>
  </div>
</main>
<script>
(()=>{"use strict";const PUBLIC_BASE=String(window.DIGIY_PUBLIC_BASE_URL||"https://driver-client.digiylyfe.com/");const $=id=>document.getElementById(id);function slug(v){return String(v||"").trim().toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"").replace(/-+/g,"-").replace(/^-|-$/g,"")}function bad(s){return !s||/\d{7,}/.test(s)||/pin|token|phone|tel|whatsapp|session/i.test(s)}function qr(v){return"https://api.qrserver.com/v1/create-qr-code/?size=520x520&margin=18&data="+encodeURIComponent(v||PUBLIC_BASE)}function publicUrl(s){const x=slug(s);if(!x||bad(x))return PUBLIC_BASE;const u=new URL(PUBLIC_BASE);u.searchParams.set("slug",x);return u.toString()}function loadData(){try{const direct=localStorage.getItem("digiy_driver_public_url");if(direct)return direct;const publicSlug=localStorage.getItem("digiy_driver_public_slug")||localStorage.getItem("digiy_driver_slug")||localStorage.getItem("digiy_driver_last_slug")||"";return publicUrl(publicSlug)}catch(_){return PUBLIC_BASE}}async function copyText(t){try{if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(t)}catch(_){}const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.left="-9999px";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}const target=loadData();$("targetUrl").textContent=target;$("openPublic").href=target;$("qrImg").src=qr(target);try{const raw=localStorage.getItem("DIGIY_DRIVER_FICHE_V2_"+(localStorage.getItem("digiy_driver_slug")||localStorage.getItem("digiy_driver_last_slug")||"NO_SLUG"));if(raw){const d=JSON.parse(raw);if(d.driverName)$("qrLabel").textContent=d.driverName}}catch(_){}$("printBtn").onclick=()=>window.print();$("copyBtn").onclick=async()=>{await copyText(target);$("copyBtn").textContent="✅ Lien copié";setTimeout(()=>$("copyBtn").textContent="📋 Copier lien",1500)}})();
</script>
</body>
</html>

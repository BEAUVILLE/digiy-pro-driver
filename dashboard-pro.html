<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>DIGIY DRIVER — Redirection vers les portes</title>
  <meta name="theme-color" content="#13824d"/>
  <meta name="robots" content="noindex,nofollow"/>
  <meta http-equiv="refresh" content="0; url=./hub.html"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:18px;
      font-family:Outfit,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:#f8fff9;
      background:
        radial-gradient(900px 520px at 8% -10%, rgba(250,204,21,.20), transparent 62%),
        radial-gradient(760px 440px at 105% 0%, rgba(34,197,94,.24), transparent 58%),
        linear-gradient(180deg,#13824d,#0f6b3e 55%,#0b4f31 100%);
    }
    .card{
      width:min(640px,100%);
      border:1px solid rgba(255,255,255,.22);
      border-radius:28px;
      padding:22px;
      background:
        radial-gradient(620px 230px at 100% 0%, rgba(250,204,21,.14), transparent 70%),
        linear-gradient(180deg,rgba(23,134,79,.96),rgba(17,107,64,.96));
      box-shadow:0 20px 46px rgba(0,0,0,.24);
      text-align:center;
    }
    .kicker{
      color:#fff0a8;
      font-size:13px;
      font-weight:1000;
      letter-spacing:.13em;
      text-transform:uppercase;
      margin-bottom:10px;
    }
    h1{
      margin:0 0 10px;
      font-size:clamp(36px,8vw,58px);
      line-height:.96;
      letter-spacing:-.06em;
      font-weight:1000;
    }
    p{
      margin:0 0 16px;
      color:rgba(248,255,249,.86);
      font-size:19px;
      line-height:1.42;
      font-weight:950;
    }
    a{
      min-height:62px;
      border-radius:20px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:14px 18px;
      text-decoration:none;
      color:#241300;
      background:linear-gradient(135deg,#facc15,#f59e0b);
      font-size:18px;
      font-weight:1000;
      box-shadow:0 14px 30px rgba(0,0,0,.18);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="kicker">Dashboard retiré</div>
    <h1>Le centre est maintenant le HUB.</h1>
    <p>Cette ancienne page reste seulement pour ne pas casser les anciens liens. Le bon départ chauffeur, c’est les portes DRIVER.</p>
    <a href="./hub.html">☰ Ouvrir les portes DRIVER</a>
  </main>
  <script>
    try{
      const current = new URL(location.href);
      const target = new URL("./hub.html", location.href);
      current.searchParams.forEach((value,key)=>{
        if(!["phone","tel","wa","p_phone","owner_phone","checkout_phone","subscription_phone","identifiant"].includes(key)){
          target.searchParams.set(key,value);
        }
      });
      location.replace(target.pathname + target.search + target.hash);
    }catch(_){
      location.replace("./hub.html");
    }
  </script>
</body>
</html>

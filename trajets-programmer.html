  <script>
    window.DIGIY_SUPABASE_URL = window.DIGIY_SUPABASE_URL || "https://wesqmwjjtsefyjnluosj.supabase.co";
    window.DIGIY_SUPABASE_ANON_KEY = window.DIGIY_SUPABASE_ANON_KEY || "sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3";
    window.DIGIY_SUPABASE_ANON = window.DIGIY_SUPABASE_ANON || window.DIGIY_SUPABASE_ANON_KEY;

  <style>
    :root{
      --bg:#0b1220;
      --bg2:#101a2e;
      --card:#14223e;
      --line:rgba(255,255,255,.16);
      --text:#eef2ff;
      --muted:#d8e0ff;
      --gold:#facc15;
      --ok:#22c55e;
      --bad:#ef4444;
      --blue:#6366f1;
      --purple:#8b5cf6;
      --r:24px;
      --shadow:0 22px 52px rgba(0,0,0,.36);
      --max:900px;
      --barH:78px;
    }

    *{box-sizing:border-box}
    html{font-size:22px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{
      margin:0;
      min-height:100dvh;
      color:var(--text);
      font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;
      font-size:20px;
      font-weight:1000;
      line-height:1.38;
      background:
        radial-gradient(900px 560px at 8% -10%,rgba(99,102,241,.34),transparent 62%),
        radial-gradient(780px 500px at 100% 0%,rgba(34,197,94,.17),transparent 58%),
        radial-gradient(680px 430px at 50% 105%,rgba(250,204,21,.10),transparent 62%),
        linear-gradient(180deg,#14213d 0%,#101b32 48%,#0c172b 100%);
      padding:12px 12px calc(var(--barH) + env(safe-area-inset-bottom,0px) + 18px);
    }

    a{color:inherit;text-decoration:none}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}

    .wrap{
      width:min(var(--max),100%);
      margin:0 auto;
      display:grid;
      gap:12px;
    }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:2px;
    }

    .back,
    .pill{
      min-height:46px;
      border-radius:999px;
      padding:10px 14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.075);
      color:var(--muted);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-size:17px;
      font-weight:1000;
    }

    .pill.ok{color:#bbf7d0;border-color:rgba(34,197,94,.38);background:rgba(34,197,94,.12)}
    .pill.warn{color:#fde68a;border-color:rgba(250,204,21,.38);background:rgba(250,204,21,.12)}
    .pill.bad{color:#fecaca;border-color:rgba(239,68,68,.38);background:rgba(239,68,68,.12)}

    .hero,
    .card{
      border:1px solid var(--line);
      border-radius:var(--r);
      background:
        radial-gradient(520px 220px at 100% 0%,rgba(99,102,241,.15),transparent 68%),
        linear-gradient(180deg,rgba(27,44,80,.98),rgba(18,31,56,.98));
      box-shadow:var(--shadow);
      padding:22px;
    }

    .eyebrow{
      display:inline-flex;
      min-height:42px;
      align-items:center;
      gap:10px;
      padding:9px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.085);
      border:1px solid var(--line);
      color:#fff0a8;
      font-size:16px;
      font-weight:1000;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    h1{
      margin:16px 0 8px;
      font-size:clamp(42px,10vw,72px);
      line-height:.96;
      font-weight:1000;
      letter-spacing:-.06em;
    }

    .lead{
      color:var(--muted);
      font-size:clamp(18px,4.4vw,23px);
      line-height:1.42;
      font-weight:950;
    }

    h2{
      margin:0 0 10px;
      font-size:clamp(31px,7vw,44px);
      line-height:1.02;
      font-weight:1000;
      letter-spacing:-.045em;
    }

    .grid{
      display:grid;
      gap:12px;
    }

    @media(min-width:760px){
      .grid{grid-template-columns:1fr 1fr}
    }

    label{
      display:block;
      margin:14px 0 7px;
      font-size:18px;
      color:#dbe4ff;
      font-weight:1000;
    }

    input,
    select,
    textarea{
      width:100%;
      min-height:66px;
      padding:14px 16px;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.16);
      color:#fff;
      outline:none;
      font-size:20px;
      font-weight:1000;
    }

    textarea{
      min-height:136px;
      resize:vertical;
      line-height:1.48;
    }

    input::placeholder,
    textarea::placeholder{
      color:rgba(219,228,255,.48);
    }

    .btn{
      min-height:70px;
      border-radius:21px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.075);
      color:var(--text);
      padding:14px 17px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      width:100%;
      font-size:20px;
      font-weight:1000;
      text-align:center;
    }

    .btn.primary{
      background:linear-gradient(135deg,var(--blue),var(--purple));
      border-color:transparent;
      box-shadow:0 16px 34px rgba(99,102,241,.34);
    }

    .btn.ok{
      background:rgba(34,197,94,.14);
      border-color:rgba(34,197,94,.34);
      color:#bbf7d0;
    }

    .btn.gold{
      background:rgba(250,204,21,.14);
      border-color:rgba(250,204,21,.34);
      color:#fde68a;
    }

    .actions{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin-top:16px;
    }

    @media(min-width:620px){
      .actions{grid-template-columns:1fr 1fr}
      .actions .wide{grid-column:1/-1}
    }

    .summary{
      display:grid;
      gap:10px;
      margin-top:12px;
    }

    .line{
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.055);
      border-radius:18px;
      padding:14px;
      color:#e8edff;
      font-size:18px;
      font-weight:1000;
      line-height:1.42;
    }

    .line strong{color:#fff}
    .money{color:#bbf7d0}
    .warn{color:#fde68a}

    .toast{
      display:none;
      position:fixed;
      left:50%;
      bottom:92px;
      transform:translateX(-50%);
      max-width:92vw;
      border:1px solid rgba(255,255,255,.16);
      border-radius:999px;
      background:rgba(7,11,19,.96);
      color:#fff;
      padding:12px 16px;
      font-size:16px;
      font-weight:1000;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      z-index:90;
      box-shadow:var(--shadow);
    }

    .bottomNav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:80;
      padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
      background:rgba(14,27,51,.96);
      border-top:1px solid rgba(255,255,255,.16);
      backdrop-filter:blur(16px);
    }

    .bottomInner{
      width:min(760px,100%);
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:6px;
    }

    .bottomInner a{
      min-height:68px;
      border-radius:17px;
      display:grid;
      place-items:center;
      align-content:center;
      gap:3px;
      color:rgba(238,242,255,.82);
      font-size:13px;
      font-weight:1000;
      text-align:center;
      border:1px solid transparent;
    }

    .bottomInner .active{
      color:#fff;
      background:linear-gradient(135deg,var(--blue),var(--purple));
      border-color:rgba(99,102,241,.32);
    }

    .ico{font-size:23px;line-height:1}

    @media(max-width:560px){
      html{font-size:20px}
      body{font-size:19px}
      .hero,.card{padding:20px 16px}
      h1{font-size:42px}
      .lead{font-size:18px}
      input,select,textarea{font-size:20px}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <a class="back" id="backLink" href="./trajets-complet.html">← Mes trajets</a>
      <span class="pill warn" id="accessPill">session…</span>
    </div>

    <section class="hero">
      <div class="eyebrow">🚕 Programmer</div>
      <h1>Nouvelle course</h1>
      <div class="lead">
        Ici le chauffeur prépare une course : client, départ, arrivée, heure, prix.
        DIGIY garde la trace, signale au HUB et prépare le lien avec PAY.
      </div>
    </section>

    <section class="grid">
      <article class="card">
        <h2>Course</h2>

        <label for="clientName">Client</label>
        <input id="clientName" placeholder="Ex : Moussa / Client hôtel / Famille"/>

        <label for="clientPhone">Téléphone client</label>
        <input id="clientPhone" inputmode="tel" placeholder="+221 ..."/>

        <label for="from">Départ</label>
        <input id="from" placeholder="Ex : Saly Centre"/>

        <label for="to">Arrivée</label>
        <input id="to" placeholder="Ex : AIBD / Dakar / Ngaparou"/>

        <label for="zone">Zone</label>
        <input id="zone" placeholder="Ex : Petite Côte"/>

        <label for="pickupDate">Date</label>
        <input id="pickupDate" type="date"/>

        <label for="pickupTime">Heure</label>
        <input id="pickupTime" type="time"/>

        <label for="amount">Prix prévu</label>
        <input id="amount" type="number" min="0" step="500" inputmode="numeric" placeholder="Ex : 25000"/>

        <label for="status">Statut</label>
        <select id="status">
          <option value="requested">Nouvelle demande</option>
          <option value="accepted" selected>Acceptée / programmée</option>
          <option value="assigned">Assignée</option>
          <option value="in_progress">En cours</option>
          <option value="completed">Terminée</option>
        </select>

        <label for="note">Note chauffeur</label>
        <textarea id="note" placeholder="Ex : bagages, attente, hôtel, paiement prévu cash ou Wave…"></textarea>

        <div class="actions">
          <button class="btn primary wide" id="saveBtn" type="button">💾 Programmer la course</button>
          <button class="btn gold" id="copyBtn" type="button">📋 Copier résumé</button>
          <button class="btn" id="clearBtn" type="button">🧹 Vider</button>

      <aside class="card">

        <div class="summary" id="summaryBox"></div>

        <div class="actions">
          <a class="btn ok wide" id="goTrips" href="./trajets-complet.html">📋 Voir mes trajets</a>
          <a class="btn gold wide" id="goPay" href="https://pro-pay.digiylyfe.com/admin.html">💰 Ouvrir PAY</a>

  <div class="toast" id="toast"></div>

      <a id="navHome" href="./hub.html"><span class="ico">🏠</span><span>Accueil</span></a>
      <a id="navTrips" href="./trajets-complet.html"><span class="ico">📋</span><span>Trajets</span></a>
      <a class="active" id="navNew" href="./trajets-programmer.html"><span class="ico">➕</span><span>Nouveau</span></a>
      <a id="navNotes" href="./trajets-complet.html#quickDriverNote"><span class="ico">✍️</span><span>Notes</span></a>
      <a id="navMore" href="./profil-chauffeur.html"><span class="ico">⚙️</span><span>Plus</span></a>
    </div>

<script>
(function(){
  "use strict";

  const MODULE = "DRIVER";
  const SIGNALS_KEY = "DIGIY_DRIVER_PRO_SIGNALS";
  const SNAPSHOT_KEY = "DIGIY_DRIVER_SYNC_SNAPSHOT_V1";
  const LOCAL_TRIPS_KEY = "DIGIY_DRIVER_LOCAL_TRIPS";

  const $ = id => document.getElementById(id);

  let slug = "";
  let phone = "";
  let accessOk = false;
  let sb = null;

  function normSlug(v){return String(v || "").trim().toLowerCase()}
  function digits(v){return String(v || "").replace(/\D/g,"")}
  function normPhone(v){
    const d = digits(v);
    if(!d) return "";
    if(d.startsWith("221") && d.length === 12) return d;
    if(d.length === 9) return "221" + d;
    return d;
  }

  function storageGet(key){
    try{
      const s = sessionStorage.getItem(key);
      if(s) return s;
    }catch(_){}
    try{
      const l = localStorage.getItem(key);
      if(l) return l;
    }catch(_){}
    return "";
  }

  function readJson(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      if(!raw) return fallback;
      const parsed = JSON.parse(raw);
      return parsed == null ? fallback : parsed;
    }catch(_){
      return fallback;
    }
  }

  function writeJson(key, value){
    try{
      localStorage.setItem(key, JSON.stringify(value));
    }catch(e){
      console.warn("[DIGIY DRIVER PROGRAMMER] mémoire impossible:", key, e?.message || e);
    }
  }

  function money(v){
    const n = Number(v || 0);
    if(!Number.isFinite(n) || n <= 0) return "—";
    return n.toLocaleString("fr-FR") + " FCFA";
  }

  function esc(v){
    return String(v ?? "").replace(/[&<>"']/g, m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"
    }[m]));
  }

  function showToast(msg){
    const el = $("toast");
    el.textContent = msg;
    el.style.display = "block";
    clearTimeout(window.__digiy_driver_program_toast);
    window.__digiy_driver_program_toast = setTimeout(() => {
      el.style.display = "none";
    }, 2500);
  }

  function cleanVisibleUrl(){
    try{
      const u = new URL(location.href);
      let changed = false;
      ["phone","tel","p_phone","pin","token"].forEach(k => {
        if(u.searchParams.has(k)){
          u.searchParams.delete(k);
          changed = true;
        }
      });
      const s = normSlug(u.searchParams.get("slug") || "");
      if(s && /\d{7,}/.test(s)){
        u.searchParams.delete("slug");
        changed = true;
      }
      if(changed) history.replaceState({}, "", u.pathname + u.search + u.hash);
    }catch(_){}
  }

  function safeReturn(){
    try{
      const u = new URL(location.href);
      ["phone","tel","p_phone","pin","token"].forEach(k => u.searchParams.delete(k));
      return u.pathname + u.search + u.hash;
    }catch(_){
      return "./trajets-programmer.html";
    }
  }

  function buildUrl(path, params = {}){
    const u = new URL(path, location.href);
    Object.entries(params).forEach(([k,v]) => {
      const val = String(v ?? "").trim();
      if(!val) return;
      if(["phone","tel","p_phone","pin","token"].includes(k)) return;
      if(k === "slug" && /\d{7,}/.test(val)) return;
      u.searchParams.set(k, val);
    });
    if(u.origin === location.origin) return u.pathname + u.search + u.hash;
    return u.toString();
  }

  function getSb(){
    if(sb?.from) return sb;
    if(window.DIGIY_GUARD?.getSb){
      try{
        sb = window.DIGIY_GUARD.getSb();
        if(sb?.from) return sb;
      }catch(_){}
    }
    if(window.supabase?.createClient){
      try{
        sb = window.supabase.createClient(
          window.DIGIY_SUPABASE_URL,
          window.DIGIY_SUPABASE_ANON || window.DIGIY_SUPABASE_ANON_KEY,
          { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false } }
        );
      }catch(_){}
    }
    return sb;
  }

  async function bootGuard(){
    try{
      if(window.DIGIY_GUARD?.ready){
        const out = window.DIGIY_GUARD.ready({ redirect:false, preserve_validation:true });
        if(out && typeof out.then === "function") await out;
      }
    }catch(_){}

    const st = window.DIGIY_GUARD?.state || {};
    const qs = new URLSearchParams(location.search);

    slug = normSlug(
      st.slug ||
      qs.get("slug") ||
      storageGet("digiy_driver_slug") ||
      storageGet("digiy_driver_last_slug") ||
      storageGet("DIGIY_SLUG") ||
      ""
    );

    phone = normPhone(
      st.phone ||
      qs.get("phone") ||
      qs.get("tel") ||
      storageGet("DIGIY_DRIVER_PHONE") ||
      storageGet("digiy_driver_phone") ||
      storageGet("DIGIY_PHONE") ||
      ""
    );

    accessOk = !!(st.access_ok || st.access || st.pin_session_ok || st.ok || slug);

    $("accessPill").className = accessOk ? "pill ok" : "pill warn";
    $("accessPill").textContent = accessOk ? "accès ouvert" : "accès à vérifier";

    cleanVisibleUrl();
    syncLinks();
  }

  function syncLinks(){
    $("backLink").href = buildUrl("./trajets-complet.html", { slug });
    $("goTrips").href = buildUrl("./trajets-complet.html", { slug });
    $("navHome").href = buildUrl("./hub.html", { slug });
    $("navTrips").href = buildUrl("./trajets-complet.html", { slug });
    $("navNew").href = buildUrl("./trajets-programmer.html", { slug });
    $("navNotes").href = buildUrl("./trajets-complet.html#quickDriverNote", { slug });
    $("navMore").href = buildUrl("./profil-chauffeur.html", { slug });
    $("goPay").href = buildUrl("https://pro-pay.digiylyfe.com/admin.html", { return:safeReturn() });
  }

  function formData(){
    const date = $("pickupDate").value || "";
    const time = $("pickupTime").value || "";
    const pickup_at = date ? `${date}T${time || "00:00"}:00` : new Date().toISOString();

    return {
      id: crypto?.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random().toString(16).slice(2),
      module: MODULE,
      source: "trajets-programmer",
      slug,
      driver_phone: phone,
      client_name: $("clientName").value.trim() || "Client",
      client_phone: $("clientPhone").value.trim(),
      pickup_label: $("from").value.trim() || "Départ à préciser",
      dropoff_label: $("to").value.trim() || "Arrivée à préciser",
      pickup_zone: $("zone").value.trim(),
      pickup_at,
      price_fcfa: Number($("amount").value || 0) || 0,
      status: $("status").value || "accepted",
      note: $("note").value.trim(),
      created_at: new Date().toISOString(),
      updated_at: new Date().toISOString()
    };
  }

  function renderSummary(){
    const d = formData();

    $("summaryBox").innerHTML = `
      <div class="line"><strong>Client :</strong> ${esc(d.client_name)}${d.client_phone ? " · " + esc(d.client_phone) : ""}</div>
      <div class="line"><strong>Trajet :</strong> ${esc(d.pickup_label)} → ${esc(d.dropoff_label)}</div>
      <div class="line"><strong>Date :</strong> ${esc(d.pickup_at.replace("T"," ").slice(0,16))}</div>
      <div class="line"><strong>Prix :</strong> <span class="money">${esc(money(d.price_fcfa))}</span></div>
      <div class="line"><strong>Statut :</strong> <span class="warn">${esc(d.status)}</span></div>
      ${d.note ? `<div class="line"><strong>Note :</strong> ${esc(d.note)}</div>` : ""}
    `;
  }

  function pushSignal(trip){
    const rows = readJson(SIGNALS_KEY, []);
    const arr = Array.isArray(rows) ? rows : [];

    arr.push({
      id: trip.id,
      module: MODULE,
      source: "trajets-programmer",
      type: "course",
      label: "Course DRIVER programmée",
      message: `${trip.client_name} · ${trip.pickup_label} → ${trip.dropoff_label}`,
      href: "./trajets-complet.html",
      slug: trip.slug || "",
      amount: trip.price_fcfa || 0,
      client: trip.client_name,
      from: trip.pickup_label,
      to: trip.dropoff_label,
      status: trip.status,
      created_at: new Date().toISOString()
    });

    writeJson(SIGNALS_KEY, arr.slice(-100));
  }

  function rememberLocalTrip(trip){
    const rows = readJson(LOCAL_TRIPS_KEY, []);
    const arr = Array.isArray(rows) ? rows : [];

    arr.push({
      id: trip.id,
      module: MODULE,
      source: "trajets-programmer",
      date: trip.pickup_at,
      client: trip.client_name,
      from: trip.pickup_label,
      to: trip.dropoff_label,
      status: trip.status,
      amount: trip.price_fcfa,
      raw: trip,
      updated_at: new Date().toISOString()
    });

    writeJson(LOCAL_TRIPS_KEY, arr.slice(-100));
  }

  function refreshSnapshot(){
    const old = readJson(SNAPSHOT_KEY, {});
    const trips = readJson(LOCAL_TRIPS_KEY, []);
    const signals = readJson(SIGNALS_KEY, []);

    const safeTrips = Array.isArray(trips) ? trips : [];
    const safeSignals = Array.isArray(signals) ? signals : [];

    const pendingTrips = safeTrips.filter(t => {
      const s = String(t.status || "").toLowerCase();
      return !s || s.includes("requested") || s.includes("assigned") || s.includes("accepted") || s.includes("pending");
    });

    const dueTrips = safeTrips.filter(t => Number(t.amount || 0) > 0);

    writeJson(SNAPSHOT_KEY, {
      ...old,
      module: MODULE,
      slug: slug || old.slug || "",
      saved_at: new Date().toISOString(),
      trips: safeTrips,
      signals: safeSignals,
      tarifs: old.tarifs || [],
      notes: old.notes || [],
      status: old.status || {},
      summary: {
        ...(old.summary || {}),
        counts: {
          ...((old.summary || {}).counts || {}),
          trips: safeTrips.length,
          pendingTrips: pendingTrips.length,
          dueTrips: dueTrips.length
        },
        pendingTrips,
        dueTrips
      }
    });
  }

  async function tryRemoteSave(trip){
    const S = getSb();
    if(!S?.from) return false;

    const row = {
      driver_phone: trip.driver_phone,
      client_name: trip.client_name,
      client_phone: trip.client_phone,
      pickup_label: trip.pickup_label,
      dropoff_label: trip.dropoff_label,
      pickup_zone: trip.pickup_zone,
      pickup_at: trip.pickup_at,
      price_fcfa: trip.price_fcfa,
      status: trip.status,
      note: trip.note,
      created_at: trip.created_at,
      updated_at: trip.updated_at
    };

    try{
      const { error } = await S.from("digiy_driver_trips").insert(row);
      if(error) throw error;
      return true;
    }catch(e){
      console.warn("[DIGIY DRIVER PROGRAMMER] Supabase insert non confirmé:", e?.message || e);
      return false;
    }
  }

  async function saveTrip(){
    const trip = formData();

    rememberLocalTrip(trip);
    pushSignal(trip);
    refreshSnapshot();

    let remoteOk = false;
    try{
      remoteOk = await tryRemoteSave(trip);
    }catch(_){}

    try{
      window.dispatchEvent(new CustomEvent("digiy:driver:trip:saved", { detail:trip }));
    }catch(_){}

    if(remoteOk){
      showToast("✅ Course programmée · mémoire + Supabase");
    }else{
      showToast("✅ Course gardée en mémoire DRIVER");
    }

    renderSummary();
  }

  async function copySummary(){
    const d = formData();
    const txt =
`🚕 Course DRIVER
Client : ${d.client_name}${d.client_phone ? " · " + d.client_phone : ""}
Départ : ${d.pickup_label}
Arrivée : ${d.dropoff_label}
Date : ${d.pickup_at.replace("T"," ").slice(0,16)}
Prix : ${money(d.price_fcfa)}
Statut : ${d.status}
${d.note ? "Note : " + d.note : ""}`.trim();

    try{
      await navigator.clipboard.writeText(txt);
      showToast("📋 Résumé copié");
    }catch(_){
      showToast("Copie impossible");
    }
  }

  function clearForm(){
    ["clientName","clientPhone","from","to","zone","amount","note"].forEach(id => {
      $(id).value = "";
    });
    $("status").value = "accepted";
    const now = new Date();
    $("pickupDate").value = now.toISOString().slice(0,10);
    $("pickupTime").value = now.toTimeString().slice(0,5);
    renderSummary();
  }

  function bind(){
    ["clientName","clientPhone","from","to","zone","pickupDate","pickupTime","amount","status","note"].forEach(id => {
      $(id).addEventListener("input", renderSummary);
      $(id).addEventListener("change", renderSummary);
    });

    $("saveBtn").addEventListener("click", saveTrip);
    $("copyBtn").addEventListener("click", copySummary);
    $("clearBtn").addEventListener("click", clearForm);
  }

  async function init(){
    bind();

    const now = new Date();
    $("pickupDate").value = now.toISOString().slice(0,10);
    $("pickupTime").value = now.toTimeString().slice(0,5);

    await bootGuard();
    renderSummary();
  }

  init().catch(e => {
    console.error("[DIGIY DRIVER PROGRAMMER] boot", e);
    showToast("Erreur au démarrage");
  });
})();
</script>

<script>
/* ══ DIGIY DRIVER — sécurité mémoire courses programmées ══ */
(function(){
  function ensureMemory(){
    return window.DIGIY_DRIVER_MEMORY || null;
  }

  function readFormTrip(){
    function val(id){ var el=document.getElementById(id); return el ? String(el.value || "").trim() : ""; }
    var date = val("pickupDate") || val("date") || val("tripDate");
    var time = val("pickupTime") || val("time") || val("tripTime");
    var pickupAt = "";
    if(date && time) pickupAt = date + "T" + time;
    else pickupAt = date || time || "";

    return {
      source:"trajets-programmer",
      client_name: val("clientName") || val("client") || val("customerName"),
      client_phone: val("clientPhone") || val("phone"),
      pickup_label: val("pickupLabel") || val("depart") || val("from"),
      dropoff_label: val("dropoffLabel") || val("arrivee") || val("to"),
      pickup_zone: val("pickupZone") || val("zone"),
      pickup_at: pickupAt,
      price_fcfa: Number(val("priceFcfa") || val("amount") || 0) || 0,
      status: val("status") || "requested",
      note: val("note") || val("driverNote")
    };
  }

  document.addEventListener("submit", function(){
    var m = ensureMemory();
    if(!m) return;
    setTimeout(function(){
      var t = readFormTrip();
      if(t.client_name || t.pickup_label || t.dropoff_label){
        m.saveScheduledTrip(t);
      }
    }, 0);
  }, true);

  document.addEventListener("click", function(e){
    var btn = e.target && e.target.closest ? e.target.closest("button,a") : null;
    if(!btn) return;
    var txt = String(btn.textContent || "").toLowerCase();
    if(!/programmer|enregistrer|garder|sauver/.test(txt)) return;
    var m = ensureMemory();
    if(!m) return;
    setTimeout(function(){
      var t = readFormTrip();
      if(t.client_name || t.pickup_label || t.dropoff_label){
        m.saveScheduledTrip(t);
      }
    }, 60);
  }, true);
})();
</script>
